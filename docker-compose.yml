version: "3.9"

services:
  app:
    image: transferflow-app:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - redis
      - kafka

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: transferflow
      POSTGRES_USER: transferflow
      POSTGRES_PASSWORD: transferflow

  redis:
    image: redis:7

  kafka:
    image: bitnami/kafka:latest
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
