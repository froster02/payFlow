apiVersion: apps/v1
kind: Deployment
metadata:
  name: transferflow-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transferflow
  template:
    metadata:
      labels:
        app: transferflow
    spec:
      containers:
        - name: transferflow
          image: transferflow-app:latest
          ports:
            - containerPort: 8080
