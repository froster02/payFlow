spring:
  application:
    name: transferflow
  datasource:
    url: jdbc:postgresql://localhost:5432/transferflow
    username: transferflow
    password: transferflow
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/transferflow_dev
    username: transferflow_dev
    password: transferflow_dev
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/transferflow
    username: transferflow
    password: transferflow
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:9092

---
spring:
  config:
    activate:
      on-profile: aws
  datasource:
    url: jdbc:postgresql://rds-placeholder:5432/transferflow
    username: aws_user
    password: aws_password
  data:
    redis:
      host: elasticache-placeholder
      port: 6379
  kafka:
    bootstrap-servers: msk-placeholder:9092
